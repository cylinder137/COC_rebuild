<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F6EF7'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white'%3E%E9%80%A0%3C/text%3E%3C/svg%3E" />
    <!-- viewport-fit=cover 必须加：否则 env(safe-area-inset-*) 恒为 0，
         App 里顶栏会压到状态栏、底栏压到导航键（造物集二期反馈第 3 条） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1117" />
    <title>造物集 · 创作者平台</title>
    <script>
      // 首屏防闪烁：先于 CSS 应用主题与主题色（与 stores/ui.js 的 KEY 保持一致）
      try {
        var root = document.documentElement
        var t = localStorage.getItem('coc_theme') || 'auto'
        var light = window.matchMedia('(prefers-color-scheme: light)').matches
        var mode = t === 'auto' ? (light ? 'light' : 'dark') : t
        root.setAttribute('data-theme', mode)
        if (mode === 'dark') root.classList.add('dark')
        var ACCENTS = {
          indigo: ['#6c86ff', '#7b5cf0', '#a855f7'],
          violet: ['#a855f7', '#8b5cf6', '#d946ef'],
          cyan: ['#22b8cf', '#3bc9db', '#4dabf7'],
          emerald: ['#2fbf71', '#20c997', '#12b886'],
          amber: ['#f59f00', '#f76707', '#e8590c'],
          rose: ['#f0506e', '#e64980', '#c2255c'],
          slate: ['#7c8a9c', '#5c6b7a', '#4a5568']
        }
        var a = ACCENTS[localStorage.getItem('coc_accent')] || ACCENTS.indigo
        root.style.setProperty('--c-primary', a[0])
        root.style.setProperty('--c-accent', a[1])
        root.style.setProperty('--c-accent-2', a[2])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
